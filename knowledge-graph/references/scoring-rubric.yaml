# 知识图谱评分细则 (scoring-rubric)

> 被 SKILL.md Stage 5 引用，定义三维评分的详细指标

---

## 维度一：KG 本身质量（满分 100，权重 40%）

| 指标 | 权重 | 评分标准 | 计算方法 |
|------|------|---------|---------|
| **准确性** | 25% | 三元组事实正确率 | 抽样验证正确数/抽样总数 |
| **完整性** | 25% | 核心概念覆盖率 + 关系覆盖率 | (核心覆盖率×0.6 + 关系覆盖率×0.4) |
| **一致性** | 20% | Schema违规数 + 逻辑矛盾数 | 100 - (违规数×5 + 矛盾数×10) |
| **连通性** | 15% | 最大连通分量占比 + 孤立节点率 | 连通占比×0.7 + (1-孤立率)×0.3 |
| **语义丰富度** | 15% | 关系类型数 + 平均属性数 + 描述完整率 | 综合评分 |

---

## 维度二：消费质量（满分 100，权重 40%）

| 指标 | 权重 | 评分标准 | 计算方法 |
|------|------|---------|---------|
| **能力问题覆盖率** | 30% | P0/P1/P2 问题可回答率 | P0×0.5 + P1×0.3 + P2×0.2 |
| **多跳推理支撑** | 25% | 平均可达路径长度 ≥ 4 跳 | min(avg_path/4, 1) × 100 |
| **推理路径多样性** | 20% | 关键实体对间独立路径数 | 抽样统计 |
| **描述可理解性** | 15% | 实体/关系有清晰描述的比例 | 有描述数/总数 |
| **规则覆盖率** | —(条件) | 有关联规则的实体占比（仅当 kg-rules.yaml 存在且非空时计入评分） | 有规则实体数 / 总实体数 × 100% |
| **流程覆盖率** | —(条件) | P0 能力问题中"X 流程如何运转"类问题可回答率（仅当 kg-flows.yaml 存在且非空时计入评分） | 可回答流程问题数 / P0流程问题总数 × 100% |
| **Token 效率** | 10% | 结构化 vs 纯文本的信息密度 | 估算评分 |

---

## 维度三：维护质量（满分 100，权重 20%）

| 指标 | 权重 | 评分标准 | 计算方法 |
|------|------|---------|---------|
| **溯源完整性** | 30% | 每个事实有来源标注的比例 | 有来源数/总数 |
| **Schema 规范性** | 25% | 本体定义的规范程度 | 专家评分 |
| **增量更新友好度** | 20% | 支持增量更新的设计程度 | 结构评估 |
| **版本管理** | 15% | 变更日志的完整性 | 有日志/总变更 |
| **文档化程度** | 10% | README/使用指南的完整性 | 文档评估 |

---

## 综合评分

```
综合分 = KG质量分 × 0.4 + 消费质量分 × 0.4 + 维护质量分 × 0.2
```

## 等级划分

| 等级 | 分数 | 含义 |
|------|------|------|
| S | ≥ 90 | 优秀，可直接用于生产 |
| A | 80-89 | 良好，需少量补充 |
| B | 70-79 | 合格，需迭代优化 |
| C | 60-69 | 不合格，需重大修改 |
| D | < 60 | 严重不合格，需重建 |
