## 流程主输出格式 (kg-flows.yaml)

```yaml
flows:
  - id: "FLOW_001"
    name: "受理单笔退款"
    description: "商户发起退款请求到退款单创建完成的主流程"
    triggerCondition: "商户通过 API 提交退款请求"
    involvedEntities: ["E_REFUND_ORDER", "E_TRADE_ORDER", "E_MERCHANT"]
    steps:
      - order: 1
        actor: "商户"
        action: "提交退款请求"
        entityRef: "E_MERCHANT"
        ruleRef: ""
        codeEntry: "refund_api.cpp:SubmitRefund()"
        output: "退款请求报文"
      - order: 2
        actor: "退款系统"
        action: "校验退款金额"
        entityRef: "E_REFUND_ORDER"
        ruleRef: "RULE_001"
        codeEntry: "refund_service.cpp:ValidateRefundAmount()"
        output: "校验结果"
    happyPath: "请求 → 校验 → 创建退款单 → 返回成功"
    errorScenarios:
      - "退款金额超限 → 返回 REFUND_AMOUNT_EXCEED"
      - "原订单不存在 → 返回 ORDER_NOT_FOUND"
```

## 流程衍生格式 (kg-flows.md)

从 `kg-flows.yaml` 渲染生成，每个流程一个小节。

```markdown
## FLOW_001 受理单笔退款

**触发条件**: 商户通过 API 提交退款请求
**涉及实体**: 退款单, 交易订单, 商户

| 步骤 | 参与者 | 动作 | 关联实体 | 关联规则 | 输出 |
|------|--------|------|---------|---------|------|
| 1 | 商户 | 提交退款请求 | E_MERCHANT | — | 退款请求报文 |
| 2 | 退款系统 | 校验退款金额 | E_REFUND_ORDER | RULE_001 | 校验结果 |

**Happy Path**: 请求 → 校验 → 创建退款单 → 返回成功
**异常场景**: 退款金额超限; 原订单不存在
```

