## 同义概念归类格式 (kg-synonym-groups)

每个已合并的概念组一行，列出保留名称和所有被归并的同义名称，供用户审查。

```markdown
# 同义概念归类清单

> 以下实体存在多个同义名称，已归类为同一概念。请审查是否合并正确。
> 标记 ✅ 表示已确认，❓ 表示待确认。

| 保留实体ID | 保留名称 | 同义名称 | 来源 | 状态 |
|-----------|---------|---------|------|------|
| E_TRADE_ORDER | 单位支付交易订单 | 交易定单, 微信支付订单 | 34-交易领域模型.md, 名词列表 | ❓ |
| E_MERCHANT | 普通商户 | 商家, 收款方, 直连商户 | 名词库, 参与方文档 | ❓ |
| E_REFUND_ORDER | 退款单 | 退款订单, 商业退款单 | 退款领域模型.md, 名词列表 | ❓ |
```

生成规则：
- 仅列出存在 ≥2 个名称的实体（只有一个名称的不列出）
- `同义名称` 包含：实体的 aliases 字段、从不同知识源提取时的不同命名、代码中的英文名
- `来源` 标注每个同义名称的出处
- `状态` 默认 ❓，用户确认后改为 ✅

