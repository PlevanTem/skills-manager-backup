## 规则主输出格式 (kg-rules.yaml)

```yaml
rules:
  - id: "RULE_001"
    name: "退款金额上限约束"
    type: "业务约束"          # 业务约束 | 状态机规则 | 权限规则 | 数据校验
    description: "退款金额不能超过原交易订单的实付金额"
    involvedEntities: ["E_REFUND_ORDER", "E_TRADE_ORDER"]
    condition: "退款金额 > 原订单实付金额"
    action: "拒绝退款申请，返回错误码 REFUND_AMOUNT_EXCEED"
    exception: "特殊商户可通过审批突破限额"
    codeLocation: "refund_service.cpp:ValidateRefundAmount()"
    priority: "P0"
    source: "退款领域用例-受理退款.md"
```

## 规则衍生格式 (kg-rules.md)

从 `kg-rules.yaml` 渲染生成，按类型分组的 Markdown 表格。

