# 三元组格式与输出格式定义

> 被 SKILL.md Stage 2/3 引用
>
> **主输出为 YAML**（机器可读），MD 为衍生格式（人类可读）。
> 所有脚本（kg_to_html.py、kg_validate.py）优先读取 YAML 文件。

---

## 标准三元组格式

```yaml
triple:
  id: "T_001"
  head:
    entity_id: "E_TRADE_ORDER"
    entity_name: "交易订单"
  relation:
    type: "聚合"
    description: "交易订单聚合交易受益单"
    cardinality: "1:*"
  tail:
    entity_id: "E_TRADE_BENEFIT_ORDER"
    entity_name: "交易受益单"
  metadata:
    source: "34-交易领域模型.md"
    confidence: 0.99
    domain: "C2B交易域"
```

---

## 实体主输出格式 (kg-entities.yaml)

YAML 为主格式，脚本和后续流程直接消费此文件。

```yaml
entities:
  - id: "E_TRADE_ORDER"
    name: "交易订单"
    name_en: "TradeOrder"
    type: "聚合根"
    domain: "C2B交易域"
    description: "交易的聚合根，统领受益单、支付单、商品单、场景单"
    aliases: ["交易单", "支付订单"]
    source: "34-交易领域模型.md"
    properties:
      - {key: "微信支付交易订单号", type: "string", required: true}
      - {key: "商户订单号", type: "string", required: true}
    community: "交易核心社区"
    confidence: 0.99
```

## 实体衍生格式 (kg-entities.md)

从 `kg-entities.yaml` 渲染生成，按业务域分组的 Markdown 表格，方便人类阅读审查。

```markdown
