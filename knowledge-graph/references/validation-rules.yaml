## 二、同名实体唯一性检查（铁律 9，阻断级）

```yaml
unique_entity_name_check:
  description: "同一业务概念（按 name 字段）在全域知识图谱中只允许存在一个权威实体"
  severity: "blocker — 不通过则阻断后续 Stage"
  method: |
    1. 收集所有领域源文件（*-kg-entities.yaml）中的全部实体
    2. 按 name 字段分组，找出 name 相同但 id 不同的实体
    3. 对每组重名实体，判定哪个是权威实体（概念归属领域拥有）
    4. 标记非权威实体为违规项
  pass_criteria: "重名实体组数 = 0（每个 name 在全域仅出现一次）"
  fail_action: |
    对每个重名组：
    1. 保留概念归属领域的权威实体
    2. 删除其余领域的影子副本
    3. 将引用影子副本的关系（head/tail）改为引用权威实体 ID
    4. 记录到 kg-entity-mapping.md
    5. 重新执行校验直至通过

shadow_entity_check:
  description: "禁止 type=引用实体 或含 cross_domain_ref 字段的影子副本"
  severity: "blocker — 不通过则阻断后续 Stage"
  method: |
    1. 遍历所有实体
    2. 检查 type 字段是否为「引用实体」
    3. 检查是否存在 cross_domain_ref 字段
    4. 任一命中即为违规
  pass_criteria: "违规实体数 = 0"
  fail_action: |
    对每个违规实体：
    1. 找到 cross_domain_ref 指向的权威实体（或按 name 匹配）
    2. 删除影子副本
    3. 将引用该影子副本的关系改为 depends_on 引用权威实体 ID
    4. 记录到 kg-entity-mapping.md
```

