## 三、孤立节点检查（铁律 7）

```yaml
orphan_check:
  description: "检测没有任何关系的孤立实体"
  method: |
    1. 遍历所有实体
    2. 对每个实体，检查是否存在至少一条关系（作为头或尾）
    3. 标记孤立实体
  pass_criteria: "孤立实体数 = 0（BFS 连通率 = 100%）"
  fail_action: |
    对每个孤立实体：
    1. 首先从原始知识源中寻找可能遗漏的关系
    2. 如果找不到，通过名词库接口或补充数据源搜索补充
    3. 如仍无法建立关系，补充域归属边或跨域桥接边
    4. 重复直至孤立实体数 = 0，不接受任何孤立节点
```

---

## 四、关系正确性检查

```yaml
relation_correctness:
  checks:
    direction_check:
      description: "关系的头尾实体是否符合语义"
      example: "交易订单 → 聚合 → 交易受益单（正确）vs 交易受益单 → 聚合 → 交易订单（错误）"

    cardinality_check:
      description: "关系的基数是否与领域模型一致"

    domain_range_check:
      description: "关系的头实体类型是否在定义的域(domain)内，尾实体类型是否在范围(range)内"

    cycle_check:
      description: "检测不应存在的循环依赖（继承关系不应有环）"

    cross_domain_check:
      description: "跨业务域的关系是否有合理的业务语义支撑"
```

---

## 五、能力问题验证

```yaml
competency_question_test:
  description: "用预定义的能力问题测试 KG 的回答能力"
  method: |
    1. 对每个能力问题，尝试在 KG 中找到回答路径
    2. 路径 = 从问题涉及的实体出发，沿关系遍历到答案实体
    3. 如果找不到路径，说明 KG 缺少必要的知识
  pass_criteria: "P0 问题 100% 可回答，P1 问题 ≥ 90% 可回答"
```

---

## 六、规则层验证（Rules Layer）

```yaml
rule_involved_entities_ref_check:
  description: "规则的 involvedEntities 中每个 ID 必须在 KG 实体列表中存在"
  severity: "error"
  method: |
    1. 遍历 kg-rules.yaml 中每条规则的 involvedEntities
    2. 对每个 entity ID，检查是否存在于 kg-entities.yaml
    3. 标记未找到的引用
  pass_criteria: "悬空引用数 = 0"
  fail_action: "列出悬空引用，补充对应实体或修正 ID"

rule_condition_action_non_empty:
  description: "每条规则的 condition 和 action 字段不能为空"
  severity: "warning"
  method: |
    1. 遍历 kg-rules.yaml 中每条规则
    2. 检查 condition 和 action 字段是否非空且长度 ≥ 5 字符
  pass_criteria: "空字段数 = 0"
  fail_action: "列出空字段的规则，回 Stage 2 从原始文档补充"

rule_type_validity:
  description: "规则 type 必须为预定义类型之一"
  severity: "error"
  allowed_types: ["业务约束", "状态机规则", "权限规则", "数据校验"]
  method: |
    1. 遍历 kg-rules.yaml 中每条规则的 type 字段
    2. 检查是否在 allowed_types 内
  pass_criteria: "非法类型数 = 0"
  fail_action: "修正为最接近的合法类型"
```

---

## 七、流程层验证（Flows Layer）

```yaml
flow_steps_non_empty:
  description: "每个流程必须包含至少一个步骤"
  severity: "error"
  method: |
    1. 遍历 kg-flows.yaml 中每个流程
    2. 检查 steps 列表是否非空
  pass_criteria: "空步骤流程数 = 0"
  fail_action: "从原始用例规约中补充步骤"

flow_entity_ref_check:
  description: "流程步骤中的 entityRef 必须在 KG 实体列表中存在"
  severity: "error"
  method: |
    1. 遍历每个流程的每个步骤的 entityRef 字段
    2. 跳过空值
    3. 对非空 entityRef，检查是否存在于 kg-entities.yaml
  pass_criteria: "悬空引用数 = 0"
  fail_action: "列出悬空引用，补充对应实体或修正 ID"

flow_rule_ref_check:
  description: "流程步骤中的 ruleRef 必须在 KG 规则列表中存在"
  severity: "warning"
  method: |
    1. 遍历每个流程的每个步骤的 ruleRef 字段
    2. 跳过空值
    3. 对非空 ruleRef，检查是否存在于 kg-rules.yaml
  pass_criteria: "悬空引用数 = 0"
  fail_action: "列出悬空引用，补充对应规则或修正 ID"
```

---

## 八、术语表层验证（Glossary Layer）

```yaml
glossary_entity_ref_check:
  description: "术语的 entityRef 必须在 KG 实体列表中存在"
  severity: "warning"
  method: |
    1. 遍历 kg-glossary.yaml 中每条术语的 entityRef 字段
    2. 跳过空值
    3. 对非空 entityRef，检查是否存在于 kg-entities.yaml
  pass_criteria: "悬空引用数 = 0"
  fail_action: "修正 entityRef 或标记为待补充"

glossary_term_uniqueness:
  description: "术语表中 term 字段全局唯一，不允许重复术语"
  severity: "error"
  method: |
    1. 收集所有术语的 term 字段
    2. 按 term 分组，找出重复项
  pass_criteria: "重复术语数 = 0"
  fail_action: "合并重复术语条目，保留信息更完整的版本"
```
