# 知识图谱验证规则 (validation-rules)

> 被 SKILL.md Stage 4 引用，定义自检的详细规则

---

## 一、覆盖率检查

### core_file_coverage — 核心信息覆盖率
```yaml
description: "核心信息文件夹中所有名词概念都在 KG 中可找到"
target: 100%
method: |
  1. 遍历核心信息目录下每个 .md 文件
  2. 提取文件中所有名词概念（类名、术语、枚举值）
  3. 在 KG 实体列表中查找匹配
  4. 计算: 匹配数 / 总概念数 × 100%
pass_criteria: "= 100%"
fail_action: "列出未覆盖的概念，回 Stage 2 补充提取"
```

### supplement_coverage — 补充信息覆盖率
```yaml
description: "补充信息（名词列表）中 90% 的名词在 KG 中可找到"
target: "≥ 95%"
method: |
  1. 解析名词列表文件
  2. 提取所有独立名词术语
  3. 在 KG 实体列表中查找匹配（精确匹配 + 别名匹配）
  4. 计算覆盖率
pass_criteria: "≥ 95%"
fail_action: "列出未覆盖的名词，通过名词库接口（xnoun 或等价接口）补充"
```

### domain_model_coverage — 领域模型类覆盖率
```yaml
description: "领域模型中所有类都在 KG 中有对应实体"
target: 100%
method: |
  1. 从领域模型文件提取所有类名
  2. 在 KG 实体列表中查找
  3. 验证类的属性也被记录
pass_criteria: "= 100%"
```

### relation_coverage — 关系覆盖率
```yaml
description: "领域模型中所有明确的关系都在 KG 中有记录"
target: "= 100%"
method: |
  1. 从领域模型提取所有关系（关联/组合/聚合/继承）
  2. 在 KG 关系列表中查找匹配
  3. 计算覆盖率
pass_criteria: "= 100%"
fail_action: "列出未覆盖的关系，回 Stage 2 补充提取"
```

