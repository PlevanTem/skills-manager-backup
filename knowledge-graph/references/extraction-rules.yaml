## 四、规则提取规则

### rule_business_rule — 业务规则 → 规则实体
```yaml
source: "需求文档、用例规约中的业务约束描述"
mapping: "每条独立的业务约束/校验/权限规则 → 一条规则"
signal_words:
  - "不能超过"
  - "必须"
  - "只有...才能"
  - "等于"
  - "先...后"
  - "不得"
  - "至少"
  - "不允许"
  - "需满足"
attributes:
  - name: "规则名称（动宾短语）"
  - type: "规则类型（业务约束/状态机规则/权限规则/数据校验）"
  - condition: "触发条件"
  - action: "执行动作或拒绝描述"
  - involvedEntities: "关联实体 ID 列表"
example:
  input: "退款金额不能超过原订单实付金额"
  output:
    id: "RULE_001"
    name: "退款金额上限约束"
    type: "业务约束"
    condition: "退款金额 > 原订单实付金额"
    action: "拒绝退款申请"
    involvedEntities: ["E_REFUND_ORDER", "E_TRADE_ORDER"]
    source: "退款领域用例-受理退款.md"
```

