## 六、术语表提取规则

### rule_glossary_entry — 实体名/英文名/同义词 → 术语条目
```yaml
source: "从 kg-entities.yaml 自动生成 + 代码扫描补充"
mapping: |
  1. 每个实体的 name → 一条术语（definition 取实体 description）
  2. 每个实体的 name_en（如非空）→ 一条术语（definition 标注为英文名）
  3. 每个实体 aliases 中的别名 → 一条术语（definition 标注为别名）
  4. 代码扫描中发现的缩写/常量名 → 一条术语
auto_generate: true
dedup_rule: "同一 term 仅保留一条，entityRef 指向同一实体时合并"
example:
  input:
    entity:
      id: "E_TRADE_ORDER"
      name: "交易订单"
      name_en: "TradeOrder"
      aliases: ["交易单", "支付订单"]
      description: "交易的聚合根，统领受益单、支付单、商品单、场景单"
  output:
    - {term: "交易订单", definition: "交易的聚合根，统领受益单、支付单、商品单、场景单", entityRef: "E_TRADE_ORDER", source: "自动生成"}
    - {term: "TradeOrder", definition: "交易订单的英文名", entityRef: "E_TRADE_ORDER", fieldRef: "name_en", source: "自动生成"}
    - {term: "交易单", definition: "交易订单的别名", entityRef: "E_TRADE_ORDER", fieldRef: "aliases", source: "自动生成"}
    - {term: "支付订单", definition: "交易订单的别名", entityRef: "E_TRADE_ORDER", fieldRef: "aliases", source: "自动生成"}
```
