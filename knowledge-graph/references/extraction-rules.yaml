# 知识图谱提取规则 (extraction-rules)

> 被 SKILL.md Stage 2 引用，定义实体/关系/属性的提取规则

---

## 一、实体提取规则

### rule_domain_class — 领域模型类 → 实体
```yaml
source: "领域模型类图中的类"
mapping: "每个类 → 一个实体"
attributes:
  - name: "类名（中文优先）"
  - type: "实体类型（聚合根/实体/值对象/枚举）"
  - domain: "所属业务子域"
  - description: "类的说明文字"
  - source_file: "来源文件路径"
example:
  input: "交易订单【聚合根】"
  output:
    id: "E_TRADE_ORDER"
    name: "交易订单"
    type: "聚合根"
    domain: "C2B交易域"
    description: "交易的聚合根，统领受益单、支付单、商品单、场景单"
```

### rule_noun_concept — 名词概念 → 实体
```yaml
source: "名词列表中的术语"
mapping: "每个名词术语 → 一个实体"
attributes:
  - name: "术语名称"
  - definition: "精准定义"
  - aliases: "同义词/别名列表"
  - domain: "所属业务子域"
dedup_rule: "如果名词已在领域模型中出现，合并而非新建"
```

### rule_enum_value — 枚举值 → 实体
```yaml
source: "枚举类型的具体值"
mapping: "每个枚举值 → 一个实体，枚举类型 → 父实体"
example:
  input: "支付方式类型 → {零钱, 零钱通, 银行卡, 信用卡, 分付...}"
  output:
    - {id: "E_PAY_METHOD_CASH", name: "零钱", type: "枚举值", parent: "支付方式"}
    - {id: "E_PAY_METHOD_LQT", name: "零钱通", type: "枚举值", parent: "支付方式"}
```

### rule_system — 系统/子系统 → 实体
```yaml
source: "系统架构描述"
mapping: "每个系统/子系统 → 一个实体"
attributes:
  - name: "系统名称"
  - level: "系统层级（系统/子系统/模块）"
  - description: "系统职责描述"
```

### rule_no_shadow_entity — 禁止跨域影子实体（铁律 9）
```yaml
source: "跨领域建模"
rule: |
  同一业务概念（按 name 字段判定）只允许在一个领域中定义为权威实体。
  下游领域需使用上游概念时，直接引用上游实体 ID，通过 depends_on 关系表达跨域依赖。
  禁止创建 type=引用实体 或带 cross_domain_ref 的影子副本。
enforcement: "Stage 4 强制校验，违反即阻断"
violation_examples:
  - bad: "退款领域创建 E_RF_交易订单 (type: 引用实体, cross_domain_ref: E_TRADE_交易订单)"
    reason: "交易订单已在交易域定义，退款领域不应再建同名实体"
  - good: "退款领域的 E_RF_交易退款单 通过 depends_on 关系直接引用 E_TRADE_交易订单"
    reason: "退款单是退款域原生概念，通过关系表达对交易订单的依赖"
dedup_rule: |
  发现同名实体出现在多个领域时：
  1. 保留概念归属领域的权威版本
  2. 删除其余领域的影子副本
  3. 将引用影子副本的关系改为引用权威实体 ID
  4. 记录到 kg-entity-mapping.md
```

