## 五、流程提取规则

### rule_business_flow — 用例规约 → 流程实体
```yaml
source: "用例规约的主成功路径和扩展步骤"
mapping: "每个用例的主成功路径 → 一个流程，扩展步骤 → errorScenarios"
signal_words:
  - "第一步"
  - "主成功路径"
  - "前置条件"
  - "后置条件"
  - "扩展步骤"
  - "步骤1"
  - "系统验证"
  - "用户提交"
attributes:
  - name: "流程名称（与用例名称对应）"
  - triggerCondition: "前置条件或触发事件"
  - steps: "按序提取每个步骤的 actor/action/entityRef/ruleRef"
  - happyPath: "主成功路径的摘要"
  - errorScenarios: "扩展步骤中的异常场景"
example:
  input: |
    用例: 受理单笔退款
    前置条件: 原交易订单已支付成功
    主成功路径:
      1. 商户提交退款请求
      2. 系统校验退款金额
      3. 系统创建退款单
  output:
    id: "FLOW_001"
    name: "受理单笔退款"
    triggerCondition: "原交易订单已支付成功，商户提交退款请求"
    steps:
      - {order: 1, actor: "商户", action: "提交退款请求", entityRef: "E_MERCHANT"}
      - {order: 2, actor: "系统", action: "校验退款金额", entityRef: "E_REFUND_ORDER", ruleRef: "RULE_001"}
      - {order: 3, actor: "系统", action: "创建退款单", entityRef: "E_REFUND_ORDER"}
    source: "退款领域用例-受理退款.md"
```

