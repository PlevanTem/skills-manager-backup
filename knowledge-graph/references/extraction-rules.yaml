## 三、属性规则

### 实体必填属性
```yaml
mandatory:
  - id: "全局唯一标识符，格式 E_{DOMAIN}_{NAME}"
  - name: "规范名称（中文）"
  - name_en: "英文名称（如有）"
  - type: "实体类型（聚合根/实体/值对象/枚举/概念/系统）"
  - domain: "所属业务子域"
  - description: "自然语言描述（≥10字）"
  - source: "数据来源文件"
```

### 实体可选属性
```yaml
optional:
  - aliases: "别名/同义词列表"
  - parent: "父概念/父类"
  - status: "生命周期状态（active/deprecated/archived）"
  - version: "版本号"
  - constraints: "约束条件列表"
  - examples: "实例举例"
```

### 关系必填属性
```yaml
mandatory:
  - type: "关系类型"
  - head: "头实体ID"
  - tail: "尾实体ID"
  - description: "关系描述"
  - source: "数据来源"
```

### 关系可选属性
```yaml
optional:
  - cardinality: "基数"
  - weight: "权重/重要度(0-1)"
  - confidence: "置信度(0-1)"
  - condition: "关系成立的条件"
  - bidirectional: "是否双向"
```

