## 二、关系提取规则

### rule_association — 领域模型关联关系
```yaml
source: "领域模型类图中的关联线"
types:
  - "关联(association)": "A 关联 → B"
  - "组合(composition)": "A 组合 → B（强生命周期依赖）"
  - "聚合(aggregation)": "A 聚合 → B（弱生命周期依赖）"
  - "继承(inheritance)": "A 继承 → B（is-a）"
  - "实现(realization)": "A 实现 → B"
attributes:
  - relation_type: "关系类型"
  - cardinality: "基数（1:1, 1:*, *:*）"
  - description: "关系描述"
  - source_file: "来源文件"
```

### rule_implicit_relation — 隐含关系
```yaml
source: "名词定义文本"
extraction_prompt: |
  从以下名词定义中提取实体间关系：
  "{definition}"
  输出格式：(头实体, 关系类型, 尾实体, 置信度)
common_relations:
  - "属于(belongs_to)": "A 是 B 的一种"
  - "包含(contains)": "A 包含 B"
  - "依赖(depends_on)": "A 的运行依赖 B"
  - "跨域依赖(depends_on)": "A 领域的实体依赖 B 领域的权威实体（跨域引用，禁止创建影子副本）"
  - "触发(triggers)": "A 事件触发 B 动作"
  - "约束(constrained_by)": "A 受 B 规则约束"
  - "支持(supports)": "A 支持 B 功能"
  - "对应(corresponds_to)": "A 与 B 一一对应"
```

### rule_business_constraint — 业务规则约束
```yaml
source: "业务规则文本"
mapping: "每条规则 → 一组约束关系"
example:
  input: "退款金额 ≤ 原订单金额"
  output:
    - {head: "退款单", relation: "约束于", tail: "交易单", rule: "退款金额≤原订单金额"}
```

### rule_cross_dimension — 交叉维度组合
```yaml
source: "交易服务类型 = 产品 × 地域 × 连接模式"
mapping: "三维组合 → 交叉关系"
example:
  - {head: "APP支付", relation: "适用于", tail: "商户直连", context: "中国大陆"}
```

